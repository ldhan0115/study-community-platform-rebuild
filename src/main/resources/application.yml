spring:
  application:
    name: study-community-platform

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/study_community}
    username: ${DB_USERNAME:study}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration